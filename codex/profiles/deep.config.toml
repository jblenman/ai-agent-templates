# ~/.codex/deep.config.toml — `codex --profile deep`
# Overlay for hard design, audit and debugging work: same model, deeper reasoning, visible reasoning summaries.
# Profile files hold only the keys that differ from ~/.codex/config.toml (Codex 0.134+).
model_reasoning_effort = "xhigh"       # Sol/Luna tiers accept up to "max"; start at xhigh, tune with Alt+, / Alt+.
model_reasoning_summary = "detailed"
plan_mode_reasoning_effort = "xhigh"
