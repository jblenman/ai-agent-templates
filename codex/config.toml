# Codex CLI — Recommended config.toml
# https://github.com/jblenman/ai-agent-templates
#
# Goal: Claude Code-like autonomy with evidence discipline, a session record that survives,
# maximum local context/history/memory, minimal outbound noise. Drop this in ~/.codex/config.toml.
#
# Checked against the config reference for Codex CLI 0.160 (2026-10-05):
#   https://developers.openai.com/codex/config-reference  (+ config-advanced, config-schema.json)
# Keys that older copies of this file used and that no longer exist or are unsupported:
#   [profiles.*] tables (retired in 0.134 — profiles are files, see the bottom), approval_policy = "untrusted",
#   features.child_agents_md (never existed), features.js_repl (retired), features.web_search (use the top-level key).
#
# ⚠ TOML ORDERING: all root-level keys MUST appear before any [table] header. A key placed after
# a [table] header belongs to that table and is silently ignored.

# ── Model ─────────────────────────────────────────────────────────────────────
# OpenAI's 2026 naming: a family (5.6, 6, 6.1) and a tier — Sol = most capable, Terra = balanced,
# Luna = efficient/high-volume ("roughly the nano tier"; in Codex it replaced gpt-5.4-mini). Codex's own
# default is gpt-6.1-sol (0.159+). On Azure the value is your deployment name: a Sol-tier deployment
# for agentic work, Terra (e.g. gpt-5.6-terra) as a capable middle, Luna only as the cheap small model.
# If only a Luna-tier deployment exists, use the `luna` profile below: it is a small model and needs a
# higher reasoning effort plus the evidence rules in AGENTS.md.
model = "gpt-6.1-sol"

suppress_unstable_features_warning = true
check_for_update_on_startup = false
web_search = "disabled"                # disabled | cached | indexed | live. Azure orgs usually reject the
                                       # web_search tool anyway. Root-level key — see the ordering note.
approval_policy = "on-request"         # on-request | never | { granular = {...} }. "untrusted" is no longer
                                       # supported, "on-failure" is deprecated. "never" for non-interactive runs.
sandbox_mode = "workspace-write"       # read-only | workspace-write | danger-full-access
# The session-notes hooks keep their file at <workspace>/session-notes.md (writable here; not under .codex, which the
# sandbox protects even inside the workspace).
# For one machine-wide notes file set SESSION_NOTES and add its folder here (never ~/.codex itself):
# sandbox_workspace_write.writable_roots = ["C:/Users/you/codex-notes"]

# ── Reasoning ─────────────────────────────────────────────────────────────────
# Levels depend on the model: Sol/Luna 5.6 and 6.x accept none|low|medium|high|xhigh|max (Luna adds none,
# Ultra is Astra-only). "medium" is the documented default for the capable tiers; a higher level does not
# fix shallow investigation — the AGENTS.md evidence rules do. Live-tune in the TUI: Alt+, / Alt+.
model_reasoning_effort = "medium"
model_reasoning_summary = "auto"       # auto | concise | detailed | none
model_verbosity = "low"                # low | medium | high (Responses API)
plan_mode_reasoning_effort = "high"    # reasoning level for the plan/explore phase
# review_model defaults to the session model; set a cheaper one for /review if you want:
# review_model = "gpt-6-luna"

# ── Context ───────────────────────────────────────────────────────────────────
tool_output_token_limit = 32000        # tool output kept in context (the default truncates large files)
project_doc_max_bytes = 65536          # AGENTS.md chain budget (default 32 KiB; the chain is root → cwd, concatenated)
project_doc_fallback_filenames = [".claude/CLAUDE.md", "CLAUDE.md"]   # reuse a Claude Code file when no AGENTS.md exists
# The 5.6 and 6.x Sol/Terra/Luna models bill prompts above 272K input tokens at 2x input / 1.5x output for the
# whole request (model pages, Oct 2026), so compact just under it; set -1 to disable auto-compaction.
model_auto_compact_token_limit = 270000

# ── Subagents (custom agents in ~/.codex/agents/*.toml — see codex/agents/README.md) ───────────────
[agents]
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6-luna"      # cheap default for spawned agents; agent files override it
default_subagent_reasoning_effort = "high"

[analytics]
enabled = false

[feedback]
enabled = false

# ── Local history ─────────────────────────────────────────────────────────────
[history]
persistence = "save-all"
max_bytes = 209715200                  # 200 MB

# ── Cross-session memory (the tool's own; the session-notes file is the user-readable record) ──
[memories]
generate_memories = true
use_memories = true
max_rollout_age_days = 90
max_unused_days = 60
min_rollout_idle_hours = 6
max_raw_memories_for_consolidation = 512
no_memories_if_mcp_or_web_search = false

# ── Features ──────────────────────────────────────────────────────────────────
[features]
hooks = true               # lifecycle hooks from ~/.codex/hooks.json (session-notes guard) — trust them once with /hooks
undo = true                # git snapshot at each turn — `codex undo`
multi_agent = true         # parallel sub-agents (they inherit model/effort/sandbox/MCP/skills from the parent)
memories = true            # enables [memories] above
prevent_idle_sleep = true  # keep the machine awake during long tasks (experimental)
request_permissions = true # the model can ask for more filesystem access without leaving the sandbox
codex_git_commit = true    # commit attribution guidance

# ── Skills (folders holding a SKILL.md; invoke with $name or let Codex pick by description) ──
# Point at the clone of this repository; use absolute paths if "~" is not expanded on your platform.
[[skills.config]]
path = "~/ai-agent-templates/skills/azure-cli"
enabled = true

[[skills.config]]
path = "~/ai-agent-templates/skills/session-notes"
enabled = true

[[skills.config]]
path = "~/ai-agent-templates/skills/kb-capture"
enabled = true

# ── Shell environment ─────────────────────────────────────────────────────────
[shell_environment_policy]
inherit = "all"            # all | core | none. Strip secrets with: filters = { exclude = ["*SECRET*", "*TOKEN*"] }

# ── TUI ───────────────────────────────────────────────────────────────────────
[tui]
animations = false
show_tooltips = false
status_line = ["model-with-reasoning", "context-remaining", "git-branch"]

# ── Profiles are separate files since Codex 0.134 ─────────────────────────────
# `codex --profile deep` loads this file, then overlays ~/.codex/deep.config.toml (only the keys that differ).
# Ready-made overlays in this repository's codex/profiles/: deep, fast, luna. Install with
#   cp ~/ai-agent-templates/codex/profiles/*.config.toml ~/.codex/
# A [profiles.name] table here is ignored by current Codex versions — do not add one.
